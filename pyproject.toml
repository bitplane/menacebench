[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nethack-run"
version = "0.1.0"
description = "Deterministic NetHack run harness"
requires-python = ">=3.10"
dependencies = ["aiohttp==3.12.15"]

[project.scripts]
nethack-run = "nethack_run.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
