# Publish the official run image. Its registry digest is what run packages
# record and what the results CI replays, so it must be added to
# config/official-images.json before runs made with it can be verified.
name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Report the image reference
        env:
          REFERENCE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Official image"
            echo
            echo "Add this reference to \`config/official-images.json\`, then deploy it with \`make pull up IMAGE=$REFERENCE\`:"
            echo
            echo "\`$REFERENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"
